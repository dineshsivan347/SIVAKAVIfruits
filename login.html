<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SK Fruits</title>
    <style>
        /* Reset and base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* subtle textured background or light gray */
            background-color: #f0f0f0;
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.08"/%3E%3C/svg%3E');
        }

        .login-wrapper {
            display: flex;
            width: 900px;
            max-width: 95%;
            height: 550px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Left Side: Form */
        .login-form-container {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-text {
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-title {
            font-size: 2rem;
            color: #222;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            background-color: #edf2fa;
            /* light blue */
            border-radius: 4px;
            font-size: 0.95rem;
            color: #333;
            outline: none;
            transition: background-color 0.2s;
        }

        .form-input:focus {
            background-color: #e2e8f4;
        }

        .form-options {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-container input {
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 0.8rem;
            color: #666;
            cursor: pointer;
        }

        .login-btn {
            background-color: #f26522;
            /* Orange */
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-block;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            background-color: #d85619;
        }

        .login-btn:disabled {
            background-color: #f9a076;
            cursor: not-allowed;
        }

        .login-error {
            color: #e11d48;
            font-size: 0.85rem;
            margin-bottom: 15px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .login-error.show {
            opacity: 1;
        }

        /* Right Side: Image */
        .login-image-container {
            flex: 1;
            background-color: #f7d2be;
            /* Peach background fallback */
            position: relative;
        }

        .login-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes imageZoom {
            from {
                transform: scale(1.05);
            }

            to {
                transform: scale(1);
            }
        }


        /* Responsive */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .login-image-container {
                display: none;
            }

            .login-form-container {
                padding: 48px 24px;
                min-height: 100vh;
                justify-content: flex-start;
                padding-top: 80px;
            }

            .login-title {
                font-size: 1.75rem;
            }

            .form-input {
                font-size: 16px;
                padding: 14px 15px;
            }

            .login-btn {
                min-height: 48px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper"
        style="animation: fadeSlideUp 0.8s ease-out forwards;">
        <!-- Left Side: Form -->
        <div class="login-form-container">
            <div class="welcome-text" style="animation: fadeSlideUp 0.8s ease-out 0.1s forwards; opacity: 0;">Hello,
                welcome back!</div>
            <h1 class="login-title" style="animation: fadeSlideUp 0.8s ease-out 0.2s forwards; opacity: 0;">Sign in to
                Your Account</h1>

            <form id="login-form" style="animation: fadeSlideUp 0.8s ease-out 0.3s forwards; opacity: 0;">
                <div class="login-error" id="login-error-msg">Invalid credentials</div>

                <div class="form-group">
                    <label class="form-label" for="username">Username or Email Address</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember-me">
                        <span class="checkbox-label">Remember Me</span>
                    </label>
                </div>

                <button type="submit" class="login-btn" id="login-submit-btn">Log In</button>
            </form>
        </div>

        <!-- Right Side: Image -->
        <div class="login-image-container" style="overflow: hidden;">
            <img src="fruits_mesh_bag.png" alt="Fresh Fruits" style="animation: imageZoom 1.2s ease-out forwards;">
        </div>
    </div>

    <!-- Engine Scripts -->
    <script src="login.js"></script>

</body>

</html>
