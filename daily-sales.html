<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Sales Report | SK Fruits</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fruitgreen: '#10b981',
            fruitmint: '#22c55e',
            fruityellow: '#f59e0b',
            fruitpink: '#ec4899',
            fruitblue: '#3b82f6'
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0b1120; color: #f8fafc; }
    .app-shell { min-height: 100vh; background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.18), transparent 24%), radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 26%), #060811; }
    .glass-panel { background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(18px); border: 1px solid rgba(148, 163, 184, 0.12); }
    .table-scroll { max-height: 62vh; overflow-x: auto; overflow-y: auto; }
    .error-text { color: #ef4444; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    .success-text { color: #34d399; }
    /* Daily sales print rules live in style.css (body.daily-sales-page) */
  </style>
</head>
<body class="app-shell daily-sales-page">
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" width="24" height="24">
            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="rgba(16, 185, 129, 0.2)"/>
            <path d="M12 2C11.5 4 10 5.5 8 6" stroke-linecap="round"/>
            <path d="M12 2C12.5 4 14 5.5 16 6" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span class="logo-text" data-translate="brand_title">Fruit Stock Analyzer</span>
          <span class="logo-tag" data-translate="brand_subtitle">SK FRUITS • TAMIL NADU</span>
        </div>
      </div>

      <nav style="flex-grow: 1;">
        <ul class="menu-list">
          <li class="menu-item">
            <a href="/" class="nav-link" data-target="view-dashboard">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <span data-translate="nav_dashboard">Dashboard</span>
            </a>
          </li>
          <li class="menu-item">
            <a href="/" class="nav-link" data-target="view-inventory">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
              </svg>
              <span data-translate="nav_inventory">Fruit Inventory</span>
            </a>
          </li>
          <li class="menu-item">
            <a href="/" class="nav-link" data-target="view-inventory-update">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              <span data-translate="nav_inventory_update">Inventory Update</span>
            </a>
          </li>
          <li class="menu-item">
            <a href="/" class="nav-link" data-target="stock-history-view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span data-translate="nav_stock_history">Stock History</span>
            </a>
          </li>
          <li class="menu-item active">
            <a href="/daily-sales" class="nav-link" data-external="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
              <span>Daily Sales Report</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="lang-switch">
          <button class="lang-btn active" id="btn-lang-en">ENGLISH</button>
          <button class="lang-btn" id="btn-lang-ta">தமிழ்</button>
        </div>
      </div>
    </aside>

    <main class="main-wrapper">
      <div id="daily-sales-root" class="daily-sales-print-root px-4 py-6 lg:px-10"></div>
    </main>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="DailySalesReport.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('daily-sales-root'));
    root.render(<DailySalesReport />);
  </script>
</body>
</html>
